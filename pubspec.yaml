name: dropdown_search
description: Simple, reactive and highly customizable Flutter Dropdown with a
  lot of features (search, popups platform, async/sync,...) with multi mode like
  menu, dialog, bottomSheet and etc.
version: 6.1.3
homepage: https://github.com/salim-lachdhaf
git: https://github.com/salim-lachdhaf/dropdown_search
repository: https://github.com/salim-lachdhaf/dropdown_search

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  pana: ^0.22.18

topics:
  - dropdown
  - autocomplete
  - form
  - material
  - popups
